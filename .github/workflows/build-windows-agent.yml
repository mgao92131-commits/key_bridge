name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "BlueType.Agent/**"
      - "BlueType.Protocol/**"
      - "BlueType.sln"
      - ".github/workflows/build-windows-agent.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish Windows agent
        run: dotnet publish BlueType.Agent/BlueType.Agent.csproj -c Release -o artifacts/windows-agent

      - name: Zip published agent
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows-agent/* -DestinationPath artifacts/BlueType.Agent-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BlueType.Agent-windows
          path: artifacts/windows-agent

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-agent-latest
          name: Windows Agent (latest)
          body: Automated Windows agent build from `${{ github.sha }}`.
          files: artifacts/BlueType.Agent-windows.zip
          make_latest: true
          fail_on_unmatched_files: true
