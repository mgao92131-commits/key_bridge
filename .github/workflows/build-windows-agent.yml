name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "BlueType.Agent/**"
      - "BlueType.Protocol/**"
      - "BlueType.sln"
      - ".github/workflows/build-windows-agent.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows agent
        run: dotnet publish BlueType.Agent/BlueType.Agent.csproj -c Release -o artifacts/windows-agent

      - uses: actions/upload-artifact@v4
        with:
          name: BlueType.Agent-windows
          path: artifacts/windows-agent
